<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GymPlanner</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="GymPlanner.Mobile.styles.css" />
    <link rel="stylesheet" href="_content/WorkoutPlanner.UI/css/material-symbols.css" />
    <link rel="icon" href="data:,">
    <style>
        .boot-splash {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            background: #0f1115;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .boot-splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .boot-splash-title {
            font-size: clamp(42px, 8vw, 84px);
            line-height: 1;
            font-weight: 800;
        }

        .boot-splash-subtitle {
            color: #c9d1d9;
            font-size: clamp(18px, 3vw, 28px);
            font-weight: 600;
        }

        .boot-splash-loader {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .boot-splash-loader span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3fb950;
            animation: boot-splash-pulse 900ms ease-in-out infinite;
        }

        .boot-splash-loader span:nth-child(2) { animation-delay: 140ms; }
        .boot-splash-loader span:nth-child(3) { animation-delay: 280ms; }

        @keyframes boot-splash-pulse {
            0%, 80%, 100% { opacity: .35; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-6px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .boot-splash-loader span { animation: none; }
        }
    </style>
</head>

<body>

    <div id="app">
        <div class="boot-splash" role="status" aria-label="Загрузка приложения">
            <div class="boot-splash-content">
                <div class="boot-splash-title">GPlanner</div>
                <div class="boot-splash-subtitle">Загрузка</div>
                <div class="boot-splash-loader" aria-hidden="true">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        Произошла непредвиденная ошибка.
        <a href="." class="reload">Перезапустить</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
