# Локальный PostgreSQL только для разработки GymPlanner.
# Запуск:  docker compose -f docker-compose.postgres.yml up -d
# Пароль здесь — тестовый для этой машины, в рабочей базе он другой
# и задаётся переменной окружения сервера, а не в репозитории.
services:
  postgres:
    image: postgres:17-alpine
    container_name: gymplanner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymplanner
      POSTGRES_USER: gymplanner
      POSTGRES_PASSWORD: gymplanner_local_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymplanner -d gymplanner"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - gymplanner-postgres-data:/var/lib/postgresql/data

volumes:
  gymplanner-postgres-data:
